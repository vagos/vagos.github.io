title: "Evangelos Lamprou"
name: "Evangelos Lamprou"
tagline: ""
description: "Evangelos (Vagos) Lamprou"
github_username: "vagos"
baseurl: ""
url: "https://vagos.github.io/"

plugins:
  - jemoji
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-toc
  - jekyll-scholar

markdown: kramdown
kramdown:
  input: GFM

sass:
  style: compressed

highlighter: rouge

collections:
  blog:
    output: true
  til:
    output: true
    permalink: /til/:name
  drafts:
    output: false

header_pages:
  - pages/index.md
  - pages/things.md
  - pages/about.md
  - pages/til.md

font-size: small

scholar:
  style: apa
  bibliography: bib.bib
  bibliography_template: bib
  sort_by: [year, month]
  order: descending

feed:
  collections:
    - til

exclude:
  - makefile
